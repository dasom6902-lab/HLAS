<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 22px; color: #202124; }
      h2 { margin: 0 0 18px; color: #1f4e78; }
      label { display: block; margin: 11px 0 5px; font-weight: 700; }
      input, select, textarea {
        box-sizing: border-box; width: 100%; padding: 8px;
        border: 1px solid #dadce0; border-radius: 4px;
      }
      textarea { height: 68px; resize: vertical; }
      .required { color: #c5221f; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      button { border: 0; border-radius: 4px; padding: 9px 18px; cursor: pointer; }
      .primary { background: #1f4e78; color: #fff; }
      .secondary { background: #f1f3f4; }
      #message { min-height: 20px; margin-top: 10px; color: #c5221f; }
      .loading { color: #5f6368; }
    </style>
  </head>
  <body>
    <h2 id="title">FUNCTION 등록</h2>

    <label for="featureId">FEATURE <span class="required">*</span></label>
    <select id="featureId" disabled></select>

    <label for="functionName">기능명 <span class="required">*</span></label>
    <input id="functionName" maxlength="200">

    <label for="description">설명</label>
    <textarea id="description"></textarea>

    <label for="inputDefinition">입력</label>
    <textarea id="inputDefinition"></textarea>

    <label for="outputDefinition">출력</label>
    <textarea id="outputDefinition"></textarea>

    <label for="relatedSheets">관련시트</label>
    <input id="relatedSheets" maxlength="300">

    <label for="status">상태 <span class="required">*</span></label>
    <select id="status"></select>

    <label for="owner">담당자</label>
    <input id="owner" maxlength="100">

    <div id="message" class="loading">화면을 준비하는 중입니다...</div>
    <div class="actions">
      <button class="secondary" onclick="google.script.host.close()">취소</button>
      <button id="saveButton" class="primary" onclick="saveFunction()" disabled>저장</button>
    </div>

    <script>
      const functionId = <?!= JSON.stringify(functionId || '') ?>;

      google.script.run
        .withSuccessHandler(initializeForm)
        .withFailureHandler(showTransportError)
        .getFunctionFormData(functionId);

      function initializeForm(response) {
        if (!response || !response.ok) {
          showApiError(response);
          return;
        }

        const data = response.data;
        fillSelect('featureId', data.featureOptions, 'featureId', function (item) {
          return item.featureId + ' · ' + item.featureName;
        });
        fillSelect('status', data.statuses, null, function (item) { return item; });

        if (data.functionData) {
          const item = data.functionData;
          document.getElementById('title').textContent = 'FUNCTION 수정';
          document.getElementById('featureId').value = item.featureId;
          document.getElementById('functionName').value = item.functionName;
          document.getElementById('description').value = item.description;
          document.getElementById('inputDefinition').value = item.inputDefinition;
          document.getElementById('outputDefinition').value = item.outputDefinition;
          document.getElementById('relatedSheets').value = item.relatedSheets;
          document.getElementById('status').value = item.status;
          document.getElementById('owner').value = item.owner;
        } else {
          document.getElementById('status').value = data.defaultStatus;
        }

        document.getElementById('featureId').disabled = false;
        document.getElementById('saveButton').disabled = false;
        document.getElementById('message').textContent =
          data.featureOptions.length ? '' : '먼저 FEATURE를 등록해 주세요.';
        document.getElementById('message').className = '';

        if (!data.featureOptions.length) {
          document.getElementById('saveButton').disabled = true;
        }
      }

      function fillSelect(id, items, valueKey, labelBuilder) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        items.forEach(function (item) {
          const option = document.createElement('option');
          option.value = valueKey ? item[valueKey] : item;
          option.textContent = labelBuilder(item);
          select.appendChild(option);
        });
      }

      function saveFunction() {
        const payload = {
          featureId: document.getElementById('featureId').value,
          functionName: document.getElementById('functionName').value,
          description: document.getElementById('description').value,
          inputDefinition: document.getElementById('inputDefinition').value,
          outputDefinition: document.getElementById('outputDefinition').value,
          relatedSheets: document.getElementById('relatedSheets').value,
          status: document.getElementById('status').value,
          owner: document.getElementById('owner').value
        };

        document.getElementById('saveButton').disabled = true;
        document.getElementById('message').textContent = '저장 중입니다...';

        const runner = google.script.run
          .withSuccessHandler(handleSaveResult)
          .withFailureHandler(showTransportError);

        if (functionId) {
          runner.updateFunction(functionId, payload);
        } else {
          runner.createFunction(payload);
        }
      }

      function handleSaveResult(response) {
        if (!response || !response.ok) {
          showApiError(response);
          document.getElementById('saveButton').disabled = false;
          return;
        }
        alert(functionId ? 'FUNCTION이 수정되었습니다.' : 'FUNCTION이 생성되었습니다.');
        google.script.host.close();
      }

      function showApiError(response) {
        const error = response && response.error;
        document.getElementById('message').textContent =
          error && error.message ? error.message : '처리 중 오류가 발생했습니다.';
        document.getElementById('message').className = '';
      }

      function showTransportError(error) {
        document.getElementById('message').textContent =
          error && error.message ? error.message : String(error);
        document.getElementById('message').className = '';
        document.getElementById('saveButton').disabled = false;
      }
    </script>
  </body>
</html>
