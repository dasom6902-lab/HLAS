<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 22px; color: #202124; }
      h2 { margin: 0 0 20px; color: #1f4e78; }
      label { display: block; margin: 13px 0 5px; font-weight: 700; }
      input, select, textarea {
        box-sizing: border-box; width: 100%; padding: 9px;
        border: 1px solid #dadce0; border-radius: 4px;
      }
      textarea { height: 90px; resize: vertical; }
      .required { color: #c5221f; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
      button { border: 0; border-radius: 4px; padding: 9px 18px; cursor: pointer; }
      .primary { background: #1f4e78; color: #fff; }
      .secondary { background: #f1f3f4; }
      #message { min-height: 20px; margin-top: 12px; color: #c5221f; }
      .loading { color: #5f6368; }
    </style>
  </head>
  <body>
    <h2 id="title">FEATURE 등록</h2>

    <label for="epicId">EPIC <span class="required">*</span></label>
    <select id="epicId" disabled></select>

    <label for="featureName">FEATURE명 <span class="required">*</span></label>
    <input id="featureName" maxlength="200">

    <label for="description">설명</label>
    <textarea id="description"></textarea>

    <label for="status">상태 <span class="required">*</span></label>
    <select id="status"></select>

    <label for="priority">우선순위</label>
    <select id="priority"></select>

    <label for="owner">담당자</label>
    <input id="owner" maxlength="100">

    <div id="message" class="loading">화면을 준비하는 중입니다...</div>
    <div class="actions">
      <button class="secondary" onclick="google.script.host.close()">취소</button>
      <button id="saveButton" class="primary" onclick="saveFeature()" disabled>저장</button>
    </div>

    <script>
      const featureId = <?!= JSON.stringify(featureId || '') ?>;

      google.script.run
        .withSuccessHandler(initializeForm)
        .withFailureHandler(showTransportError)
        .getFeatureFormData(featureId);

      function initializeForm(response) {
        if (!response || !response.ok) {
          showApiError(response);
          return;
        }

        const data = response.data;
        fillSelect('epicId', data.epicOptions, 'epicId', function (item) {
          return item.epicId + ' · ' + item.epicName;
        });
        fillSelect('status', data.statuses, null, function (item) { return item; });
        fillSelect('priority', data.priorities, null, function (item) { return item; });

        if (data.feature) {
          document.getElementById('title').textContent = 'FEATURE 수정';
          document.getElementById('epicId').value = data.feature.epicId;
          document.getElementById('featureName').value = data.feature.featureName;
          document.getElementById('description').value = data.feature.description;
          document.getElementById('status').value = data.feature.status;
          document.getElementById('priority').value = data.feature.priority;
          document.getElementById('owner').value = data.feature.owner;
        } else {
          document.getElementById('status').value = data.defaultStatus;
          document.getElementById('priority').value = data.defaultPriority;
        }

        document.getElementById('epicId').disabled = false;
        document.getElementById('saveButton').disabled = false;
        document.getElementById('message').textContent =
          data.epicOptions.length ? '' : '먼저 EPIC을 등록해 주세요.';
        document.getElementById('message').className = '';
        if (!data.epicOptions.length) {
          document.getElementById('saveButton').disabled = true;
        }
      }

      function fillSelect(id, items, valueKey, labelBuilder) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        items.forEach(function (item) {
          const option = document.createElement('option');
          option.value = valueKey ? item[valueKey] : item;
          option.textContent = labelBuilder(item);
          select.appendChild(option);
        });
      }

      function saveFeature() {
        const payload = {
          epicId: document.getElementById('epicId').value,
          featureName: document.getElementById('featureName').value,
          description: document.getElementById('description').value,
          status: document.getElementById('status').value,
          priority: document.getElementById('priority').value,
          owner: document.getElementById('owner').value
        };

        document.getElementById('saveButton').disabled = true;
        document.getElementById('message').textContent = '저장 중입니다...';

        const runner = google.script.run
          .withSuccessHandler(handleSaveResult)
          .withFailureHandler(showTransportError);

        if (featureId) {
          runner.updateFeature(featureId, payload);
        } else {
          runner.createFeature(payload);
        }
      }

      function handleSaveResult(response) {
        if (!response || !response.ok) {
          showApiError(response);
          document.getElementById('saveButton').disabled = false;
          return;
        }
        alert(featureId ? 'FEATURE가 수정되었습니다.' : 'FEATURE가 생성되었습니다.');
        google.script.host.close();
      }

      function showApiError(response) {
        const error = response && response.error;
        document.getElementById('message').textContent =
          error && error.message ? error.message : '처리 중 오류가 발생했습니다.';
        document.getElementById('message').className = '';
      }

      function showTransportError(error) {
        document.getElementById('message').textContent =
          error && error.message ? error.message : String(error);
        document.getElementById('message').className = '';
        document.getElementById('saveButton').disabled = false;
      }
    </script>
  </body>
</html>
