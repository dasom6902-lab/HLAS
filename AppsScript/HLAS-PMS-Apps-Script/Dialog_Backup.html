<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>body{font-family:Arial,sans-serif;margin:24px;color:#1f2937}button{padding:8px 12px;margin:4px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #ddd;padding:7px;text-align:left}th{background:#1f4e78;color:white}</style>
</head>
<body>
  <h2>Backup Center</h2>
  <button onclick="createBackup()">백업 생성</button>
  <button onclick="load()">새로고침</button>
  <div id="status"></div>
  <table><thead><tr><th>ID</th><th>시간</th><th>파일</th><th>상태</th><th>작업</th></tr></thead><tbody id="rows"></tbody></table>
  <script>
    function show(v){document.getElementById('status').textContent=JSON.stringify(v);}
    function fail(e){show({ok:false,error:String(e.message||e)});}
    function createBackup(){google.script.run.withSuccessHandler(function(r){show(r);load();}).withFailureHandler(fail).createBackup();}
    function restore(id){if(confirm('이 백업으로 복원하시겠습니까?'))google.script.run.withSuccessHandler(function(r){show(r);load();}).withFailureHandler(fail).restoreBackup(id);}
    function remove(id){if(confirm('백업 파일과 이력을 삭제하시겠습니까?'))google.script.run.withSuccessHandler(function(r){show(r);load();}).withFailureHandler(fail).deleteBackup(id);}
    function load(){google.script.run.withSuccessHandler(function(r){if(!r.ok){show(r);return;}document.getElementById('rows').innerHTML=r.data.map(function(x){return '<tr><td>'+x.BACKUP_ID+'</td><td>'+x.TIMESTAMP+'</td><td>'+x.FILE_NAME+'</td><td>'+x.STATUS+'</td><td><button onclick="restore(\\''+x.BACKUP_ID+'\\')">복원</button><button onclick="remove(\\''+x.BACKUP_ID+'\\')">삭제</button></td></tr>';}).join('');}).withFailureHandler(fail).listBackups();}
    load();
  </script>
</body>
</html>
